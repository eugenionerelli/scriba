[project]
name = "scriba"
version = "0.1.0"
description = "Da memo vocale a fonte per NotebookLM: trascrive, separa le voci, impara chi è chi."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eugenio Nerelli" }]
keywords = ["whisper", "whisperx", "pyannote", "diarization", "transcription", "notebooklm"]
classifiers = [
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"
dependencies = [
    "whisperx>=3.3.1",
    "pyannote.audio>=3.3.2",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/eugenionerelli/scriba"
Issues = "https://github.com/eugenionerelli/scriba/issues"

[project.scripts]
scriba = "scriba.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scriba"]
