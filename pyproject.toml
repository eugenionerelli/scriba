[project]
name = "scriba"
version = "0.1.0"
description = "Turns a recorded conversation into a document that says who said what."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eugenio Nerelli" }]
keywords = ["whisper", "whisperx", "pyannote", "diarization", "transcription", "speaker-identification"]
classifiers = [
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"
# The floors are the versions this is measured against, not the oldest that
# imports. whisperX 3.8.6 is where digit-bearing tokens stopped coming out of the
# aligner with no timestamp, and pyannote 4 is where diarization runs on Metal.
# Under pyannote 3 the code still loads, and the numbers in the README do not hold.
dependencies = [
    "whisperx>=3.8.6",
    "pyannote.audio>=4.0",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/nerln/scriba"
Issues = "https://github.com/nerln/scriba/issues"

[project.scripts]
scriba = "scriba.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scriba"]
